name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Install, Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # Node setup — use the same major version as your local dev env
      # ---------------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ---------------------------------------------------------------
      # FIX: Use `npm ci` (clean install) which always installs BOTH
      # dependencies AND devDependencies regardless of NODE_ENV.
      # Never use `npm install --production` or set NODE_ENV=production
      # before the build step, as that strips devDeps (including vite).
      # ---------------------------------------------------------------
      - name: Install all dependencies (including devDependencies)
        run: npm ci

      # Verify vite is available before attempting the build
      - name: Verify vite binary exists
        run: npx vite --version

      - name: Build frontend
        run: npm run build
        env:
          # Keep NODE_ENV=production so Vite optimises output,
          # but note this is set AFTER npm ci so deps are already installed.
          NODE_ENV: production

      # ---------------------------------------------------------------
      # Upload the built dist/ folder as an artifact so it can be
      # downloaded or passed to a deployment job.
      # ---------------------------------------------------------------
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # -----------------------------------------------------------------
  # Optional deployment job — uncomment and configure for your host.
  # Examples for common platforms are shown below.
